<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VitalLog">
  <title>VitalLog</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173d1a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="hc">
      <polygon points="16,1.5 29,8.75 29,23.25 16,30.5 3,23.25 3,8.75"/>
    </clipPath>
  </defs>

  <!-- Hexagon -->
  <polygon points="16,1.5 29,8.75 29,23.25 16,30.5 3,23.25 3,8.75" fill="url(#bg)"/>
  <rect x="0" y="0" width="32" height="17" fill="url(#shine)" clip-path="url(#hc)"/>

  <!-- V mark -->
  <line x1="8.5" y1="10" x2="16" y2="21.5"
        stroke="rgba(255,255,255,0.93)" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="21.5" x2="23.5" y2="10"
        stroke="#ff7043" stroke-width="3" stroke-linecap="round"/>
  <circle cx="23.5" cy="10" r="2" fill="#ff7043" opacity="0.8"/>
</svg>
